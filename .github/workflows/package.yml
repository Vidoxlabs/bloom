name: Package a Bloom release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag to package
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BLOOM_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check the requested version
        shell: bash
        run: '[[ "$BLOOM_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]'
      - uses: actions/checkout@v6
        with:
          ref: refs/tags/${{ env.BLOOM_TAG }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.1'
      - name: Test the extracted download
        shell: bash
        run: |
          set -euo pipefail
          version=${BLOOM_TAG#v}
          test "$(node -p "require('./package.json').version")" = "$version"
          name="bloom-$version"
          git archive --format=zip --prefix="$name/" --output="$RUNNER_TEMP/$name.zip" HEAD
          cd "$RUNNER_TEMP"
          sha256sum "$name.zip" > "$name.zip.sha256"
          mkdir archive-check
          unzip -q "$name.zip" -d archive-check
          cd "archive-check/$name"
          npm test
          npm run test:network
      - name: Attach the ZIP and its checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          name="bloom-${BLOOM_TAG#v}.zip"
          assets=$(gh release view "$BLOOM_TAG" --repo "$GITHUB_REPOSITORY" --json assets)
          for file in "$name" "$name.sha256"; do
            existing=$(jq -c --arg file "$file" '.assets[] | select(.name == $file)' <<< "$assets")
            if [[ -n "$existing" ]]; then
              digest="sha256:$(sha256sum "$file" | cut -d ' ' -f 1)"
              test "$(jq -r .digest <<< "$existing")" = "$digest"
            else
              gh release upload "$BLOOM_TAG" "$file" --repo "$GITHUB_REPOSITORY"
            fi
          done
      - name: Verify the anonymous public download
        if: github.event.repository.private == false
        shell: bash
        run: |
          set -euo pipefail
          name="bloom-${BLOOM_TAG#v}.zip"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/download/$BLOOM_TAG"
          mkdir "$RUNNER_TEMP/public-download"
          cd "$RUNNER_TEMP/public-download"
          for file in "$name" "$name.sha256"; do
            curl --fail --silent --show-error --location --retry 4 --retry-all-errors "$url/$file" --output "$file"
          done
          cmp "$name.sha256" "$RUNNER_TEMP/$name.sha256"
          sha256sum --check "$name.sha256"
