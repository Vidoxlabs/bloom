name: Verify Bloom
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22.13.1'
      - run: npm test
      - run: npm run test:network
  browser:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --no-save --package-lock=false playwright@1.65.1
      - run: npx playwright install --with-deps chromium
      - run: node --test checks/browser.mjs
        env:
          BLOOM_UI_EVIDENCE: ${{ runner.temp }}/bloom-ui
      - uses: actions/upload-artifact@v4
        with:
          name: bloom-browser-views
          path: ${{ runner.temp }}/bloom-ui
          retention-days: 7
      - run: docker compose -f compose.desktop.yaml config -q
        env:
          BLOOM_DESKTOP_PATH: /tmp/bloom-desktop
  opencode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm install --prefix "$RUNNER_TEMP/bloom-runtime" --ignore-scripts opencode-linux-x64@1.18.30
      - run: BLOOM_OPENCODE_BIN="$RUNNER_TEMP/bloom-runtime/node_modules/opencode-linux-x64/bin/opencode" node --test checks/opencode.mjs
